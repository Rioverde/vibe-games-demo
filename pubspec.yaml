name: vibe_games_demo
description: Battle Pass test task
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  auto_route: ^11.1.0
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.0
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter_gen:
  output: lib/generated/
  line_length: 120
  assets:
    outputs:
      class_name: Assets

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/items/
    - assets/images/nav/
    - assets/icons/
  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica.ttf
